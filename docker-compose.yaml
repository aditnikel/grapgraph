services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grapgraph-api
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 500M
        reservations:
          cpus: "0.5"
          memory: 200M
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDRS: "redis:6379"
      REDIS_PASSWORD: ""
      GRAPH_NAME: "fraudnet"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: falkordb/falkordb:edge
    container_name: redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 500M
        reservations:
          cpus: "0.5"
          memory: 200M
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
    restart: unless-stopped

volumes:
  redis-data:
